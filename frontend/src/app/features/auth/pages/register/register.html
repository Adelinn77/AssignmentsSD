<div class="login-wrapper">
  <div class="login-card">
    <h1 class="login-title">Create Account</h1>

    @if (errorMsg()) {
      <div class="error-banner">
        {{ errorMsg() }}
      </div>
    }

    <div class="form-group">
      <label for="reg-username">Username <span class="required">*</span></label>
      <input
        id="reg-username"
        type="text"
        placeholder="Choose a username"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
      />
    </div>

    <div class="form-group">
      <label for="reg-password">Username <span class="required">*</span></label>
      <input
        id="reg-password"
        type="text"
        placeholder="Choose a password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
      />
    </div>

    <div class="form-group">
      <label for="reg-email">Email <span class="required">*</span></label>
      <input
        id="reg-email"
        type="email"
        placeholder="Enter your email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
      />
    </div>

    <div class="form-group">
      <label for="reg-first">First Name</label>
      <input
        id="reg-first"
        type="text"
        placeholder="First name"
        [ngModel]="firstName()"
        (ngModelChange)="firstName.set($event)"
      />
    </div>
    <div class="form-group">
      <label for="reg-last">Last Name</label>
      <input
        id="reg-last"
        type="text"
        placeholder="Last name"
        [ngModel]="lastName()"
        (ngModelChange)="lastName.set($event)"
      />
    </div>

    <div class="form-group">
      <label for="reg-phone">Phone</label>
      <input
        id="reg-phone"
        type="tel"
        placeholder="Phone number (optional)"
        [ngModel]="phone()"
        (ngModelChange)="phone.set($event)"
      />
    </div>

    <div class="btn-group">
      <button
        class="btn btn-primary"
        id="btn-register"
        (click)="register()"
        [disabled]="isLoading()"
      >
        {{ isLoading() ? 'Creating...' : 'Create Account' }}
      </button>
      <button class="btn btn-secondary" id="btn-back-login" routerLink="/auth/login">
        Back to Login
      </button>
    </div>
  </div>
</div>
